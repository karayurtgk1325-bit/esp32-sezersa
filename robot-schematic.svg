<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
  <defs>
    <style>
      .box { fill: #f4f7fb; stroke: #1f2937; stroke-width: 3; }
      .module { fill: #e8f1ff; stroke: #2563eb; stroke-width: 2.5; }
      .power { fill: #eafaf1; stroke: #16a34a; stroke-width: 2.5; }
      .motor { fill: #fff7ed; stroke: #f59e0b; stroke-width: 2.5; }
      .label { font: 22px Arial, sans-serif; fill: #111827; }
      .small { font: 18px Arial, sans-serif; fill: #1f2937; }
      .pin { font: 17px Arial, sans-serif; fill: #0f172a; }
      .line { stroke: #111827; stroke-width: 3; fill: none; }
      .wire { stroke: #2563eb; stroke-width: 3; fill: none; }
      .wire2 { stroke: #dc2626; stroke-width: 3; fill: none; }
      .wire3 { stroke: #16a34a; stroke-width: 3; fill: none; }
      .wire4 { stroke: #7c3aed; stroke-width: 3; fill: none; }
      .dot { fill: #111827; }
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 18px Arial, sans-serif; fill: #374151; }
    </style>
  </defs>

  <rect width="1800" height="1000" fill="#ffffff"/>
  <text x="900" y="48" text-anchor="middle" class="title">ESP32-S3 Robot Wiring Diagram</text>
  <text x="900" y="80" text-anchor="middle" class="subtitle">2-Wheel Robot with OLED Face, Touch Wake, Motor Driver, Mic and Speaker</text>

  <!-- ESP32-S3 -->
  <rect x="180" y="150" width="360" height="560" rx="16" class="module"/>
  <text x="360" y="190" text-anchor="middle" class="label">ESP32-S3-N16R8</text>
  <text x="360" y="220" text-anchor="middle" class="small">Main Controller</text>

  <!-- SSD1306 -->
  <rect x="650" y="180" width="260" height="170" rx="14" class="module"/>
  <text x="780" y="215" text-anchor="middle" class="label">SSD1306 OLED</text>
  <text x="780" y="245" text-anchor="middle" class="small">128x64 Display</text>

  <!-- TTP223 -->
  <rect x="650" y="420" width="260" height="120" rx="14" class="module"/>
  <text x="780" y="455" text-anchor="middle" class="label">TTP223</text>
  <text x="780" y="485" text-anchor="middle" class="small">Touch Wake Button</text>

  <!-- L298N -->
  <rect x="650" y="600" width="260" height="220" rx="14" class="module"/>
  <text x="780" y="635" text-anchor="middle" class="label">L298N Mini</text>
  <text x="780" y="665" text-anchor="middle" class="small">Motor Driver</text>

  <!-- MIC -->
  <rect x="1040" y="160" width="260" height="140" rx="14" class="module"/>
  <text x="1170" y="195" text-anchor="middle" class="label">INMP441</text>
  <text x="1170" y="225" text-anchor="middle" class="small">Microphone</text>

  <!-- Speaker -->
  <rect x="1040" y="390" width="260" height="160" rx="14" class="module"/>
  <text x="1170" y="425" text-anchor="middle" class="label">MAX98357</text>
  <text x="1170" y="455" text-anchor="middle" class="small">I2S Audio Amp</text>

  <!-- Speaker output -->
  <rect x="1380" y="430" width="180" height="120" rx="14" class="motor"/>
  <text x="1470" y="470" text-anchor="middle" class="label">4Ω Mini</text>
  <text x="1470" y="500" text-anchor="middle" class="small">Speaker</text>

  <!-- Left motor -->
  <rect x="1380" y="650" width="170" height="120" rx="14" class="motor"/>
  <text x="1465" y="690" text-anchor="middle" class="label">Motor A</text>
  <text x="1465" y="720" text-anchor="middle" class="small">Left Wheel</text>

  <!-- Right motor -->
  <rect x="1380" y="800" width="170" height="120" rx="14" class="motor"/>
  <text x="1465" y="840" text-anchor="middle" class="label">Motor B</text>
  <text x="1465" y="870" text-anchor="middle" class="small">Right Wheel</text>

  <!-- Battery -->
  <rect x="130" y="790" width="240" height="130" rx="14" class="power"/>
  <text x="250" y="840" text-anchor="middle" class="label">Battery</text>
  <text x="250" y="870" text-anchor="middle" class="small">5V / 12V System</text>

  <!-- Wires to OLED -->
  <path d="M 540 350 L 650 350" class="wire"/>
  <path d="M 650 350 L 650 290" class="wire"/>
  <text x="590" y="332" class="pin">GPIO38 SDA</text>
  <path d="M 540 370 L 650 370" class="wire2"/>
  <path d="M 650 370 L 650 330" class="wire2"/>
  <text x="590" y="352" class="pin">GPIO39 SCL</text>

  <!-- OLED power -->
  <path d="M 650 260 L 565 260 L 565 100 L 300 100" class="wire3"/>
  <text x="440" y="92" class="pin">3.3V</text>
  <path d="M 650 240 L 610 240 L 610 120 L 250 120" class="wire2"/>
  <text x="430" y="110" class="pin">GND</text>

  <!-- Touch wire -->
  <path d="M 540 500 L 650 500" class="wire4"/>
  <text x="580" y="482" class="pin">GPIO2 OUT</text>
  <path d="M 650 500 L 690 500" class="wire4"/>
  <path d="M 690 500 L 690 470" class="wire4"/>
  <text x="690" y="460" class="pin">3.3V / GND</text>

  <!-- L298N control wires -->
  <path d="M 540 600 L 650 600" class="wire"/>
  <text x="580" y="580" class="pin">GPIO20 IN1</text>
  <path d="M 540 620 L 650 620" class="wire"/>
  <text x="580" y="600" class="pin">GPIO21 IN2</text>
  <path d="M 540 640 L 650 640" class="wire"/>
  <text x="580" y="620" class="pin">GPIO22 IN3</text>
  <path d="M 540 660 L 650 660" class="wire"/>
  <text x="580" y="640" class="pin">GPIO23 IN4</text>
  <path d="M 540 700 L 650 700" class="wire3"/>
  <text x="580" y="682" class="pin">GPIO26 ENA</text>
  <path d="M 540 720 L 650 720" class="wire3"/>
  <text x="580" y="702" class="pin">GPIO27 ENB</text>

  <!-- L298N ground -->
  <path d="M 540 740 L 610 740 L 610 800 L 350 800" class="wire2"/>
  <text x="490" y="782" class="pin">GND Common</text>

  <!-- Battery to L298N -->
  <path d="M 370 790 L 370 770 L 650 770" class="wire3"/>
  <text x="460" y="760" class="pin">Bat +12V</text>
  <path d="M 370 920 L 370 900 L 650 900 L 650 820" class="wire2"/>
  <text x="420" y="922" class="pin">Bat GND</text>

  <!-- motor outputs -->
  <path d="M 910 770 L 1380 770" class="wire4"/>
  <text x="1120" y="752" class="pin">OUT1/OUT2 → Motor A</text>
  <path d="M 910 840 L 1380 840" class="wire4"/>
  <text x="1120" y="822" class="pin">OUT3/OUT4 → Motor B</text>

  <!-- Mic wires -->
  <path d="M 540 260 L 1040 260" class="wire"/>
  <text x="760" y="242" class="pin">GPIO17 BCLK</text>
  <path d="M 540 280 L 1040 280" class="wire"/>
  <text x="760" y="262" class="pin">GPIO18 LRCL</text>
  <path d="M 540 300 L 1040 300" class="wire"/>
  <text x="760" y="282" class="pin">GPIO16 DIN</text>

  <!-- Mic power -->
  <path d="M 1170 300 L 1170 420 L 1040 420" class="wire3"/>
  <text x="1185" y="390" class="pin">3.3V</text>
  <path d="M 1170 300 L 1170 375 L 1060 375" class="wire2"/>
  <text x="1185" y="360" class="pin">GND</text>

  <!-- Speaker wires -->
  <path d="M 1300 470 L 1380 470" class="wire4"/>
  <text x="1320" y="455" class="pin">I2S</text>
  <path d="M 1170 550 L 1170 620 L 1200 620" class="wire3"/>
  <text x="1180" y="610" class="pin">3.3V</text>
  <path d="M 1160 550 L 1160 610 L 1180 610" class="wire2"/>
  <text x="1085" y="610" class="pin">GND</text>

  <!-- Max98357 wire to GPIOs -->
  <path d="M 540 330 L 1040 330" class="wire4"/>
  <text x="780" y="312" class="pin">GPIO4 BCLK</text>
  <path d="M 540 350 L 1040 350" class="wire4"/>
  <text x="780" y="332" class="pin">GPIO5 LRCLK</text>
  <path d="M 540 370 L 1040 370" class="wire4"/>
  <text x="780" y="352" class="pin">GPIO6 DIN</text>

  <!-- Common ground and power labels -->
  <text x="155" y="740" class="label">Power Rail</text>
  <text x="155" y="770" class="small">3.3V / GND / 12V</text>

  <!-- Notes -->
  <rect x="990" y="620" width="670" height="240" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="1025" y="660" class="label">Notes</text>
  <text x="1025" y="700" class="small">• SSD1306 uses I2C: SDA=GPIO38, SCL=GPIO39</text>
  <text x="1025" y="735" class="small">• Touch module TTP223 uses GPIO2 as wake input</text>
  <text x="1025" y="770" class="small">• L298N shares GND with ESP32 and motor power is separated</text>
  <text x="1025" y="805" class="small">• INMP441 and MAX98357 use I2S pins</text>
  <text x="1025" y="840" class="small">• Use a proper battery regulator and common ground for stable operation</text>
</svg>
